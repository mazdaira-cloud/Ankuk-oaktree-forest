<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Halo Rings (World Tree Aura) -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="url(#goldGlow)" stroke-width="6" opacity="0.3" stroke-dasharray="12 8" />
  <circle cx="256" cy="230" r="190" fill="none" stroke="url(#goldGlow)" stroke-width="3" opacity="0.2" />

  <!-- Basalt Column (Joseph Beuys Stele) -->
  <polygon points="170,390 195,290 220,300 210,410" fill="#334155" />
  <polygon points="195,290 220,300 215,285" fill="#475569" />
  <polygon points="210,410 220,300 228,405" fill="#1e293b" />

  <!-- Oak Trunk -->
  <path d="M 235,420 Q 256,330 256,250 Q 256,330 277,420 Z" fill="url(#trunkGrad)" />
  <path d="M 256,270 Q 220,230 200,210" stroke="#78350f" stroke-width="12" stroke-linecap="round" fill="none" />
  <path d="M 256,250 Q 290,220 315,205" stroke="#78350f" stroke-width="12" stroke-linecap="round" fill="none" />

  <!-- Tree Canopy / Leaves Clusters (Oak Foliage) -->
  <!-- Back Canopy Layer -->
  <circle cx="256" cy="180" r="85" fill="url(#leafGrad1)" opacity="0.95" />
  <circle cx="190" cy="210" r="70" fill="url(#leafGrad1)" opacity="0.95" />
  <circle cx="322" cy="210" r="70" fill="url(#leafGrad1)" opacity="0.95" />
  <circle cx="220" cy="140" r="60" fill="url(#leafGrad2)" />
  <circle cx="292" cy="140" r="60" fill="url(#leafGrad2)" />
  <circle cx="256" cy="115" r="50" fill="url(#leafGrad2)" />

  <!-- Acorn Emblem in Canopy (Golden) -->
  <g transform="translate(240, 150) scale(1.6)" filter="url(#glowEffect)">
    <!-- Cupule -->
    <path d="M 4,6 C 4,3 16,3 16,6 L 15,9 C 15,10 5,10 5,9 Z" fill="#78350f" />
    <path d="M 10,1 L 10,3" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    <!-- Nut -->
    <path d="M 5,9 C 5,17 15,17 15,9 Z" fill="url(#goldGlow)" />
  </g>

  <!-- Ground Grass Mound -->
  <ellipse cx="256" cy="425" rx="160" ry="24" fill="#047857" opacity="0.8" />
  <ellipse cx="256" cy="430" rx="130" ry="16" fill="#065f46" />

  <!-- Brand Typography -->
  <text x="256" y="475" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="28" font-weight="900" letter-spacing="4">700 DIGITAL OAKS</text>
</svg>
